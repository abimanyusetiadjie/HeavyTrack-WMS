server {
    listen 80;
    server_name wms.mitraabadinusantara.co.id; # Ganti dengan domain / subdomain Anda (atau IP jika belum ada domain)

    root /var/www/heavytrack-wms/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/heavytrack-access.log;
    error_log /var/log/nginx/heavytrack-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM Handling
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # Sesuaikan dengan versi PHP di VPS (misal: php8.2 atau php8.3)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
